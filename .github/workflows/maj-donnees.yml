name: Mise à jour des données

on:
  schedule:
    - cron: "0 5 * * *"   # chaque jour vers 6 h / 7 h (heure de Paris)
  workflow_dispatch: {}    # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: maj-donnees
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer les nouvelles parties
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python scripts/fetch_riot.py
      - name: Enregistrer data.js s'il a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -m "Mise à jour des données"
          git push
